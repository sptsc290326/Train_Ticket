<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quên mật khẩu - G7 TrainTick</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

<div class="login-wrapper">

  <div class="text-center mb-4">
    <i class="fa-solid fa-train train-logo"></i>
    <h2 class="fw-bold text-white">G7 TrainTick</h2>
  </div>

  <div class="login-card">
    <div class="text-center mb-4">
      <div style="width:64px;height:64px;background:rgba(30,79,216,.1);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px">
        <i class="fa-solid fa-lock" style="font-size:1.6rem;color:var(--blue-main)"></i>
      </div>
      <h3 class="fw-bold" style="font-size:1.3rem">Quên mật khẩu?</h3>
      <p style="font-size:.88rem;color:var(--text-muted);margin:0">Nhập email hoặc SĐT để nhận hướng dẫn đặt lại mật khẩu</p>
    </div>

    <div class="mb-3">
      <label class="form-label">Email hoặc Số điện thoại</label>
      <div class="input-group">
        <span class="input-group-text"><i class="fa-regular fa-envelope"></i></span>
        <input type="text" id="forgotInput" class="form-control"
               placeholder="Nhập email hoặc số điện thoại"
               onkeydown="if(event.key==='Enter') sendResetLink()">
      </div>
      <small id="forgotError" class="text-danger"></small>
    </div>

    <button class="btn-login" onclick="sendResetLink()" style="background:var(--blue-main);color:white;margin-top:4px">
      <i class="fa-solid fa-paper-plane" style="margin-right:8px"></i>
      Gửi yêu cầu
    </button>

    <div class="text-center mt-4">
      <a href="login.html" style="color:var(--blue-main);font-size:.9rem;font-weight:600">
        <i class="fa-solid fa-arrow-left"></i> Quay lại đăng nhập
      </a>
    </div>
  </div>

</div>

<script src="js/function.js"></script>
    <script src="js/api-front.js"></script>
  </body>
</html>
